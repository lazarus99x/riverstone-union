  <!-- Windows row 1 -->
  <rect x="20" y="26" width="8" height="8" rx="1.5" fill="white" opacity="0.85"/>
  <rect x="36" y="26" width="8" height="8" rx="1.5" fill="white" opacity="0.85"/>
  <!-- Windows row 2 -->
  <rect x="20" y="38" width="8" height="8" rx="1.5" fill="white" opacity="0.85"/>
  <rect x="36" y="38" width="8" height="8" rx="1.5" fill="white" opacity="0.85"/>
  <!-- Door -->
  <rect x="27" y="48" width="10" height="8" rx="2" fill="white" opacity="0.9"/>
  <!-- "W" watermark subtle -->
  <text x="32" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1d4ed8" opacity="0.3">W</text>
